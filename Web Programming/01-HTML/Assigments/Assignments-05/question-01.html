<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form</title>
</head>

<body>

  <center>
    <h2>Student Registration Form</h2>
  </center>

  <hr>

  <form id="Register" action="/01-HTML/Assigments/Assignments-05/submit.html" method="post">

    <table>

      <tr>
        <td>
          <label for="firstname">First Name:</label>
        </td>

        <td>
          <input type="text"
                 id="firstname"
                 name="firstname"
                 placeholder="Enter first name"
                 required
                 autofocus>
        </td>
      </tr>

      <tr>
        <td>
          <label for="lastname">Last Name:</label>
        </td>

        <td>
          <input type="text"
                 id="lastname"
                 name="lastname"
                 placeholder="Enter last name"
                 required>
        </td>
      </tr>

      <tr>
        <td>
          <label for="password">Password:</label>
        </td>

        <td>
          <input type="password"
                 id="password"
                 name="password"
                 placeholder="Enter password"
                 minlength="8"
                 required>
        </td>
      </tr>

      <tr>
        <td></td>

        <td>
          <button>
            <a href="/01-HTML/Assigments/Assignments-05/submit.html">Register</a>
          </button>
          <!-- <input id="Register" type="submit" value="Register"> -->
          <input type="reset" value="Reset">
        </td>
      </tr>

    </table>

  </form>

</body>

</html>
